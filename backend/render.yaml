services:
  - type: web
    name: accessible-housing-backend
    env: python
    plan: free  # Free tier - spins down after 15 min inactivity
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: APPS_SCRIPT_URL
        sync: false  # Update in Render dashboard with your Apps Script URL
      - key: CORS_ORIGINS
        value: https://sainisomesh.github.io
        sync: false
      - key: DATABASE_URL
        sync: false  # Leave empty for SQLite, or add PostgreSQL URL

